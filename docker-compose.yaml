services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: sqlserver2017
    restart: unless-stopped
    ports:
      - 2866:1433
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_PID: 'Standard'
    volumes:
      - ./mssql:/docker-entrypoint-initdb.d
      - ./mssql/backups:/var/opt/mssql/backup
    networks:
      - databases
  
  mssql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    restart: unless-stopped
    ports:
      - 2433:1433
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_PID: 'Standard'
    volumes:
      # - ./mssql/2022:/var/opt/mssql/data
      - ./mssql/backups:/var/opt/mssql/backup
    networks:
      - databases

  mysql:
    image: mysql:8.0.26
    command: --default-authentication-plugin=mysql_native_password
    container_name: mysql-db
    restart: unless-stopped
    ports:
      - 6612:3306
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d
      - ./mysql:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - databases

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-test}
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - databases

  redis:
    image: redis:7.2
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - 6379:6379
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./redis:/data
    networks:
      - databases

  redis_insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: unless-stopped
    ports:
      - 5540:5540
    environment:
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD}
      - RI_REDIS_HOST=redis
    volumes:
      - ./redis_insight:/data
    networks:
      - databases
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      # - xpack.security.enabled=false
      # Local dev: REST on 9200 stays HTTP so Kibana can use http://elasticsearch:9200 (avoids TLS/plain mismatch).
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "3200:9200"
      - "9300:9300"
    healthcheck:
      # With http.ssl disabled, any HTTP response (e.g. 401) means the node is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9200"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - databases
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${ELASTICSEARCH_KIBANA_TOKEN}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - databases


networks:
  databases:
    name: databases
    driver: bridge